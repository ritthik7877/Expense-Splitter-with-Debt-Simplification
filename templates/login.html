{% extends "base.html" %}
{% block title %}Sign in - SplitSmart{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <section class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-3">Welcome back</h1>
    <p class="text-muted">Sign in to see your shared expenses.</p>
    <form id="auth-form" data-mode="login">
      <label class="form-label" for="username">Username</label>
      <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="mt-3 mb-0">New here? <a href="/register/">Create an account</a></p>
  </div></section>
</div></div>
{% endblock %}
