<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SplitSmart{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/dashboard/">SplitSmart</a>
      <a class="btn btn-outline-light btn-sm" href="/api/docs/">API docs</a>
    </div>
  </nav>
  <main class="container py-4">{% block content %}{% endblock %}</main>
  <div id="toast" class="alert d-none position-fixed bottom-0 end-0 m-3 shadow" role="alert"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
