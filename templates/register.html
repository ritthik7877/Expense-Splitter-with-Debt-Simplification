{% extends "base.html" %}
{% block title %}Create account - SplitSmart{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <section class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-3">Create your account</h1>
    <form id="auth-form" data-mode="register">
      <label class="form-label" for="username">Username</label>
      <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
      <label class="form-label" for="email">Email</label>
      <input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" required>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a href="/login/">Sign in</a></p>
  </div></section>
</div></div>
{% endblock %}
