services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "docker-development-key-change-me-please"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"
    volumes:
      - splitsmart-data:/app/data

volumes:
  splitsmart-data:
